<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronocoin</title>
    <!-- Подключаем скрипт Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
            user-select: none;
        }

        .header {
            text-align: center;
            margin-top: 10px;
        }

        .header h1 {
            font-size: 26px;
            margin: 0;
            letter-spacing: 2px;
            color: #00d2ff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }

        .score-container {
            font-size: 42px;
            font-weight: bold;
            color: #ffd700;
            margin-top: 10px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }

        .center-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }

        /* Центральная круглая кнопка-майнинг */
        .mine-btn {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 5px solid #00d2ff;
            background: radial-gradient(circle, #00d2ff, #3a7bd5);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.6);
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            outline: none;
            padding: 15px;
            text-align: center;
        }

        .mine-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
        }

        .mine-btn-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .mine-btn-sub {
            font-size: 13px;
            opacity: 0.9;
        }

        /* Нижнее меню навигации */
        .bottom-nav {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-around;
            background: rgba(25, 25, 40, 0.9);
            padding: 10px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            margin-bottom: 5px;
        }

        .nav-item {
            background: none;
            border: none;
            color: #b3b3b3;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: color 0.2s;
            outline: none;
        }

        .nav-item.active, .nav-item:hover {
            color: #00d2ff;
        }

        /* Контентные вкладки */
        .tab-content {
            display: none;
            width: 100%;
            max-width: 400px;
            flex-grow: 1;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .tab-content.active {
            display: flex;
        }

        .card {
            background: rgba(25, 25, 40, 0.85);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        .link-btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #00b09b, #96c93d);
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            margin-top: 10px;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0, 176, 155, 0.4);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>CHRONOCOIN</h1>
        <div class="score-container">
            <span id="coins">0</span>
        </div>
    </div>

    <!-- Вкладка 1: Майнинг -->
    <div id="tab-mining" class="tab-content active">
        <div class="center-area">
            <!-- Главный круглый интерактивный элемент -->
            <button class="mine-btn" id="mine-main-btn" onclick="handleMineClick()">
                <span class="mine-btn-title" id="btn-title">Включить майнинг</span>
                <span class="mine-btn-sub" id="btn-sub">60 мин</span>
            </button>
        </div>
    </div>

    <!-- Вкладка 2: Задания -->
    <div id="tab-tasks" class="tab-content">
        <div class="card">
            <h3 style="margin-top: 0; color: #00d2ff;">Ежедневные задания</h3>
            <p style="color: #b3b3b3; font-size: 14px;">Скоро здесь появятся задания для получения дополнительных монет!</p>
        </div>
    </div>

    <!-- Вкладка 3: О нас -->
    <div id="tab-about" class="tab-content">
        <div class="card">
            <h3 style="margin-top: 0; color: #00d2ff;">О проекте</h3>
            <p style="color: #b3b3b3; font-size: 14px; line-height: 1.4;">
                Chronocoin — это инновационная игра в Telegram. Следите за нашими новостями, дорожной картой и анонсами в соцсетях!
            </p>
            <a href="https://t.me/your_channel" target="_blank" class="link-btn">Наш Telegram канал</a>
        </div>
    </div>

    <!-- Нижнее меню навигации -->
    <div class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('mining', this)">
            <span>⛏️</span> Майнинг
        </button>
        <button class="nav-item" onclick="switchTab('tasks', this)">
            <span>📋</span> Задания
        </button>
        <button class="nav-item" onclick="switchTab('about', this)">
            <span>ℹ️</span> О нас
        </button>
    </div>
