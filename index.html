<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronocoin</title>
    <!-- Подключаем скрипт Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
            user-select: none;
        }

        .header {
            text-align: center;
            margin-top: 5px;
        }

        .header h1 {
            font-size: 24px;
            margin: 0;
            letter-spacing: 2px;
            color: #00d2ff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }

        .score-container {
            font-size: 38px;
            font-weight: bold;
            color: #ffd700;
            margin-top: 8px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }

        .info-panel {
            font-size: 13px;
            color: #b3b3b3;
            margin-top: 3px;
        }

        .timer-box {
            background: rgba(0, 210, 255, 0.1);
            border: 1px solid rgba(0, 210, 255, 0.3);
            padding: 8px 15px;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 14px;
            color: #00d2ff;
            font-weight: bold;
        }

        .center-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }

        .mine-btn {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            border: 5px solid #00d2ff;
            background: radial-gradient(circle, #00d2ff, #3a7bd5);
            color: white;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.6);
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            outline: none;
            margin-bottom: 15px;
        }

        .mine-btn:active {
            transform: scale(0.92);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
        }

        .start-session-btn {
            background: linear-gradient(135deg, #00b09b, #96c93d);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 176, 155, 0.4);
            transition: transform 0.1s;
        }

        .start-session-btn:active {
            transform: scale(0.95);
        }

        .start-session-btn:disabled {
            background: #4a4a5a;
            color: #8a8a9a;
            box-shadow: none;
            cursor: not-allowed;
        }

        .upgrades {
            width: 100%;
            max-width: 400px;
            background: rgba(25, 25, 40, 0.85);
            padding: 12px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .upgrade-btn {
            width: 100%;
            background-color: #2c2c46;
            color: white;
            border: 1px solid #4a4a75;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            transition: background 0.2s;
        }

        .upgrade-btn:last-child {
            margin-bottom: 0;
        }

        .upgrade-btn:hover:not(:disabled) {
            background-color: #3b3b61;
        }

        .upgrade-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .cost {
            color: #ffd700;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>CHRONOCOIN</h1>
        <div class="score-container">
            <span id="coins">0</span>
        </div>
        <div class="info-panel">
            Доход: +<span id="pps">0</span>/сек | Клик: +<span id="click-power">1</span>
        </div>
        <div class="timer-box" id="timer-display">
            Майнинг неактивен
        </div>
    </div>

    <div class="center-area">
        <button class="mine-btn" onclick="mine()">ТАП</button>
        <button class="start-session-btn" id="start-btn" onclick="startMiningSession()">Запустить майнинг (60 мин)</button>
    </div>

    <div class="upgrades">
        <button class="upgrade-btn" id="buy-rig" onclick="buyRig()">
            <span>Ферма времени (+1/сек)</span>
            <span class="cost" id="rig-cost">10 COIN</span>
        </button>
        <button class="upgrade-btn" id="buy-click" onclick="buyClickUpgrade()">
            <span>Улучшенный клик (+1)</span>
            <span class="cost" id="click-cost">25 COIN</span>
        </button>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Игровые переменные
        let coins = 0;
        let pps = 0;           
        let clickPower = 1;    
        let rigCost = 10;      
        let clickCost = 25;    
        
        let timeLeft = 0;      // Оставшееся время сессии в секундах
        let isMiningActive = false;

        // Загрузка данных из облака Telegram CloudStorage
        function loadGame() {
            if (tg.CloudStorage) {
                tg.CloudStorage.getItem('coins', (err, value) => { if (!err && value) coins = parseFloat(value); });
                tg.CloudStorage.getItem('pps', (err, value) => { if (!err && value) pps = parseInt(value); });
                tg.CloudStorage.getItem('clickPower', (err, value) => { if (!err && value) clickPower = parseInt(value); });
                tg.CloudStorage.getItem('rigCost', (err, value) => { if (!err && value) rigCost = parseInt(value); });
                tg.CloudStorage.getItem('clickCost', (err, value) => { if (!err && value) clickCost = parseInt(value); });
                
                // Загружаем оставшееся время сессии майнинга
                tg.CloudStorage.getItem('timeLeft', (err, value) => {
                    if (!err && value) {
                        timeLeft = parseInt(value);
                        if (timeLeft > 0) {
                            isMiningActive = true;
                            document.getElementById('start-btn').disabled = true;
                        }
                    }
                });
            }
        }

        // Сохранение данных в облако Telegram CloudStorage
        function saveGame() {
            if (tg.CloudStorage) {
                tg.CloudStorage.setItem('coins', coins.toString());
                tg.CloudStorage.setItem('pps', pps.toString());
                tg.CloudStorage.setItem('clickPower', clickPower.toString());
                tg.CloudStorage.setItem('rigCost', rigCost.toString());
                tg.CloudStorage.setItem('clickCost', clickCost.toString());
                tg.CloudStorage.setItem('timeLeft', timeLeft.toString());
            }
        }

        // Запуск сессии майнинга на 60 минут (3600 секунд)
        function startMiningSession() {
            if (!isMiningActive) {
                timeLeft = 3600; // 60 минут
                isMiningActive = true;
                document.getElementById('start-btn').disabled = true;
                updateUI();
                saveGame();
            }
        }

        // Клик по центральной кнопке
        function mine() {
            coins += clickPower;
            updateUI();
            saveGame();
        }

        // Покупка фермы пассивного дохода
        function buyRig() {
            if (coins >= rigCost) {
                coins -= rigCost;
                pps += 1;
                rigCost = Math.floor(rigCost * 1.5);
                updateUI();
                saveGame();
            }
        }

        // Покупка силы клика
        function buyClickUpgrade() {
            if (coins >= clickCost) {
                coins -= clickCost;
                clickPower += 1;
                clickCost = Math.floor(clickCost * 1.8);
                updateUI();
                saveGame();
            }
        }

        // Форматирование времени в ММ:СС
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // Обновление интерфейса
        function updateUI() {
            document.getElementById('coins').innerText = Math.floor(coins);
            document.getElementById('pps').innerText = pps;
            document.getElementById('click-power').innerText = clickPower;
            document.getElementById('rig-cost').innerText = rigCost + ' COIN';
            document.getElementById('click-cost').innerText = clickCost + ' COIN';
            
            const timerDisplay = document.getElementById('timer-display');
            const startBtn = document.getElementById('start-btn');

            if (isMiningActive && timeLeft > 0) {
                timerDisplay.innerText = `До конца майнинга: ${formatTime(timeLeft)}`;
                startBtn.disabled = true;
            } else {
                timerDisplay.innerText = "Майнинг остановлен. Нажмите Старт!";
                startBtn.disabled = false;
            }

            // Блокировка кнопок улучшений при нехватке монет
            document.getElementById('buy-rig').disabled = coins < rigCost;
            document.getElementById('buy-click').disabled = coins < clickCost;
        }

        // Главный игровой таймер (каждую секунду)
        setInterval(() => {
            if (isMiningActive && timeLeft > 0) {
                timeLeft -= 1;
                if (pps > 0) {
                    coins += pps;
                }
                if (timeLeft <= 0) {
                    isMiningActive = false;
                }
                updateUI();
                saveGame();
            }
        }, 1000);

        // Инициализация при старте
        loadGame();
        setTimeout(() => {
            updateUI();
        }, 400);
    </script>

</body>
</html>
