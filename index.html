<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChronoCoin</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --text-color: #1c1c1e;
            --hint-color: #8e8e93;
            --primary-color: #ff2d55;
            --card-bg: #ffffff;
            --border-color: #e5e5ea;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: 80px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        h1, h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #111;
        }

        p {
            color: var(--hint-color);
            font-size: 15px;
            line-height: 1.4;
            margin-top: 0;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            margin-bottom: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.02);
        }

        .info-card {
            text-align: left;
            background: linear-gradient(135deg, #ffffff 0%, #fff5f7 100%);
            border-left: 5px solid var(--primary-color);
            padding: 22px;
        }

        .info-card p {
            color: #48484a;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .info-card ul {
            padding-left: 20px;
            margin: 12px 0;
            color: var(--text-color);
        }

        .info-card li {
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 10px;
            color: #3a3a3c;
        }

        .balance-title {
            font-size: 14px;
            color: var(--hint-color);
            margin-bottom: 4px;
        }

        .balance-value {
            font-size: 34px;
            font-weight: 800;
            color: #f5a623;
            margin-bottom: 16px;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 8px;
            box-shadow: 0 4px 12px rgba(255, 45, 85, 0.3);
        }

        .btn:active {
            opacity: 0.8;
        }

        .btn:disabled {
            background-color: #d1d1d6;
            box-shadow: none
                <div class="content">
        <!-- TAB 1: MINING -->
        <div id="tab-mining" class="tab-content active">
            <h2>Chrono Mining</h2>
            <div class="card">
                <div class="balance-title">Ваш баланс</div>
                <div class="balance-value" id="balance">0.00 CC</div>
                
                <div id="timer-container" style="display: none;">
                    <div class="timer-display" id="timer">01:00:00</div>
                    <p id="mining-status">Идет обычный майнинг...</p>
                </div>

                <button class="btn" id="start-mining-btn" onclick="startMining()">Запустить майнинг (1 час)</button>
                
                <div style="margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 15px;">
                    <button class="btn" id="start-night-mining-btn" style="background-color: #5856d6;" onclick="startNightMining()">Ночной майнинг (6 часов)</button>
                    <p style="font-size: 12px; margin-top: 6px; color: var(--hint-color);">Доступно с 22:00 до 23:59 (Требуется 5 видео)</p>
                </div>
            </div>

            <div class="card" style="text-align: left; padding: 16px;">
                <h3 style="font-size: 16px; margin-bottom: 8px;">Статистика скорости</h3>
                <p style="font-size: 14px; margin: 0;">Текущая базовая скорость: <strong id="current-speed" style="color: #111;">1 CC/ч</strong></p>
                <p style="font-size: 13px; margin-top: 4px; color: var(--hint-color);">Приглашайте друзей, чтобы увеличить скорость добычи!</p>
            </div>
        </div>

        <!-- TAB 2: TASKS -->
        <div id="tab-tasks" class="tab-content">
            <h2>Ежедневные задания</h2>
            
            <!-- Wheel of Fortune Task -->
            <div class="task-item">
                <div class="task-info">
                    <div class="task-title">Колесо фортуны</div>
                    <div class="task-reward">+ Награда / 12 часов (3 видео)</div>
                    <div id="wheel-timer" style="font-size: 12px; color: #007aff; margin-top: 4px; font-weight: bold;"></div>
                </div>
                <button class="task-btn" id="wheel-btn" onclick="openWheelTask()">Крутить</button>
            </div>

            <div class="task-item">
                <div class="task-info">
                    <div class="task-title">Посмотреть видео (1/5)</div>
                    <div class="task-reward">+0.5 CC</div>
                </div>
                <button class="task-btn" onclick="completeTask(this, 0.5)">Смотреть</button>
            </div>
            <div class="task-item">
                <div class="task-info">
                    <div class="task-title">Подписаться на Telegram</div>
                    <div class="task-reward">+1.0 CC</div>
                </div>
                <button class="task-btn" onclick="completeTask(this, 1.0)">Подписаться</button>
            </div>
            <div class="task-item">
                <div class="task-info">
                    <div class="task-title">Подписаться на Instagram</div>
                    <div class="task-reward">+1.0 CC</div>
                </div>
                <button class="task-btn" onclick="completeTask(this, 1.0)">Подписаться</button>
            </div>

            <h2 style="margin-top: 24px;">Специальные задания</h2>
            <div class="task-item" style="opacity: 0.6;">
                <div class="task-info">
                    <div class="task-title">Еженедельное задание</div>
                    <div class="task-reward">Скоро</div>
                </div>
                <button class="task-btn" style="background-color: #8e8e93;" disabled>Скоро</button>
            </div>
        </div>

        <!-- TAB 3: FRIENDS -->
        <div id="tab-friends" class="tab-content">
            <h2>Друзья</h2>
            <div class="card" style="text-align: left;">
                <p style="font-size: 14px; margin-bottom: 12px;">Приглашайте друзей и увеличивайте скорость майнинга:</p>
                <ul style="padding-left: 18px; font-size: 13px; color: #3a3a3c; margin-bottom: 16px; line-height: 1.5;">
                    <li>10 друзей = 2 CC/ч</li>
                    <li>20 друзей = 3 CC/ч</li>
                    <li>30 друзей = 4 CC/ч</li>
                    <li>50 друзей = 20 CC/ч</li>
                    <li>100 друзей = 50 CC/ч</li>
                </ul>
                <button class="btn" onclick="inviteFriend()">Пригласить друга</button>
            </div>
            <div class="card" style="text-align: left;">
                <h3 style="font-size: 15px; margin-bottom: 8px;">Список приглашенных (<span id="friend-count">0</span>)</h3>
                <div class="referral-list" id="friend-list-container">
                    Никого еще не приглашено
                </div>
            </div>
        </div>

        <!-- TAB 4: WALLET -->
        <div id="tab-wallet" class="tab-content">
            <h2>Кошелек</h2>
            <div class="card">
                <div class="balance-title">Доступно к выводу</div>
                <div class="balance-value" id="wallet-balance">0.00 CC</div>
                <p style="font-size: 13px; margin-bottom: 16px;">Интеграция с блокчейн-сетями и вывод токенов станут доступны после завершения этапа тестирования.</p>
                <button class="btn" style="background-color: #8e8e93;" disabled>Подключить кошелек (Скоро)</button>
            </div>
        </div>

        <!-- TAB 5: INFO -->
        <div id="tab-info" class="tab-content">
            <h2>О проекте</h2>
            <div class="card info-card">
                <p><strong>Что такое ChronoCoin?</strong> Это уникальный цифровой проект, созданный с нуля на стыке концепции времени и криптовалюты. Наша идея родилась из стремления создать по-настоящему честную экосистему, где каждый участник имеет равные возможности для старта и развития.</p>
                
                <p>Успех и развитие проекта зависят исключительно от вашей активности.</p>
                
                <ul>
                    <li><strong>Активность:</strong> Самым активным участникам в будущем будут начисляться эксклюзивные аирдропы.</li>
                    <li><strong>Друзья:</strong> Скорость майнинга растет от приглашений (от 2 до 50 CC/ч).</li>
                    <li><strong>Задания:</strong> Прохождение ежедневных заданий и колеса фортуны обязательно для будущего проекта.</li>
                </ul>

                <p><strong>Партнерство и сотрудничество:</strong> Мы всегда открыты к новым предложениям! Если вы хотите сотрудничать с нами или стать партнером проекта, вы можете легко связаться с нашей командой через официальные социальные сети.</p>

                <p style="border-top: 1px solid rgba(255,45,85,0.2); padding-top: 14px; margin-top: 14px;"><strong>Обращение от разработчиков:</strong> Мы просим каждого из вас проявить максимальную активность и <strong>обязательно подписаться на наши соцсети</strong>, чтобы нас заметили и о нас услышал весь мир! Каждый, кто пройдет этот путь до конца вместе с нами, обязательно получит достойное вознаграждение за свои усилия и преданность проекту. Давайте сделаем это вместе, ведь всё в наших руках!</p>
            </div>
        </div>
    </div>
            <!-- NAVIGATION BAR -->
    <nav class="nav-bar">
        <button class="nav-item active" onclick="switchTab('mining', this)">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H7c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.03-.42 1.98-1.07 2.75z"/></svg>
            <span>Майнинг</span>
        </button>
        <button class="nav-item" onclick="switchTab('tasks', this)">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
            <span>Задания</span>
        </button>
        <button class="nav-item" onclick="switchTab('friends', this)">
            <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            <span>Друзья</span>
        </button>
        <button class="nav-item" onclick="switchTab('wallet', this)">
            <svg viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
            <span>Кошелек</span>
        </button>
        <button class="nav-item" onclick="switchTab('info', this)">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
            <span>Инфо</span>
        </button>
    </nav>

    <!-- MODAL FOR WATCHING VIDEOS (Night Mining / Wheel of Fortune) -->
    <div id="activation-modal" style="display: none;">
        <div class="modal-content">
            <h3 id="modal-title" style="margin-top:0; font-size:18px;">Просмотр видео</h3>
            <p id="modal-desc" style="font-size: 14px; margin: 15px 0;">Пожалуйста, просмотрите видео для активации функции.</p>
            <div id="modal-progress" style="font-weight: bold; font-size: 16px; color: #ff2d55; margin-bottom: 15px;">Видео 1 из 5</div>
            <button class="btn" id="modal-watch-btn" onclick="simulateVideoWatch()">Смотреть видео</button>
            <button class="btn" id="modal-close-btn" style="background-color: #8e8e93; margin-top: 8px; display: none;" onclick="closeModal()">Закрыть</button>
        </div>
    </div>
            <script>
        // Состояние приложения
        let state = {
            balance: 0,
            speed: 1, // CC/ч
            miningEndTime: null,
            miningDuration: 0, // в часах (1 или 6)
            wheelNextAvailable: 0,
            friends: [],
            completedTasks: {}
        };

        let modalCallback = null;
        let videoRequiredTotal = 0;
        let videoCurrentWatched = 0;

        // Загрузка сохраненных данных
        function loadState() {
            const saved = localStorage.getItem('chronocoin_state');
            if (saved) {
                try {
                    state = JSON.parse(saved);
                } catch(e) { console.error(e); }
            }
            updateUI();
        }

        // Сохранение данных
        function saveState() {
            localStorage.setItem('chronocoin_state', JSON.stringify(state));
        }

        // Переключение вкладок
        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            document.getElementById('tab-' + tabId).classList.add('active');
            element.classList.add('active');
        }

        // Обновление интерфейса
        function updateUI() {
            document.getElementById('balance').innerText = state.balance.toFixed(2) + ' CC';
            document.getElementById('wallet-balance').innerText = state.balance.toFixed(2) + ' CC';
            document.getElementById('current-speed').innerText = state.speed + ' CC/ч';
            
            // Список друзей
            const friendListContainer = document.getElementById('friend-list-container');
            document.getElementById('friend-count').innerText = state.friends.length;
            if (state.friends.length > 0) {
                friendListContainer.innerHTML = state.friends.map(f => `<div>• ${f}</div>`).join('');
            } else {
                friendListContainer.innerHTML = 'Никого еще не приглашено';
            }

            // Проверка майнинга
            checkMiningTimer();
            // Проверка колеса фортуны
            checkWheelTimer();
        }

        // --- МАЙНИНГ ЛОГИКА ---
        function startMining() {
            state.miningEndTime = Date.now() + 1 * 60 * 60 * 1000; // 1 час
            state.miningDuration = 1;
            saveState();
            updateUI();
        }

        // Ночной майнинг (строго с 22:00 до 23:59, требует 5 видео)
        function startNightMining() {
            const now = new Date();
            const hours = now.getHours();
            
            // Проверка времени: с 22:00 до 23:59
            if (hours < 22 || hours >= 24) {
                alert('Ночной майнинг доступен строго с 22:00 до 23:59!');
                return;
            }

            // Запускаем модальное окно для просмотра 5 видео
            openModal("Ночной майнинг (6 часов)", 5, function() {
                state.miningEndTime = Date.now() + 6 * 60 * 60 * 1000; // 6 часов
                state.miningDuration = 6;
                saveState();
                updateUI();
                alert('Ночной майнинг успешно активирован на 6 часов!');
            });
        }

        function checkMiningTimer() {
            if (!state.miningEndTime) return;
            
            const now = Date.now();
            const diff = state.miningEndTime - now;

            const timerContainer = document.getElementById('timer-container');
            const startBtn = document.getElementById('start-mining-btn');
            const nightBtn = document.getElementById('start-night-mining-btn');
            const miningStatus = document.getElementById('mining-status');

            if (diff > 0) {
                timerContainer.style.display = 'block';
                startBtn.style.display = 'none';
                nightBtn.style.display = 'none';

                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);

                document.getElementById('timer').innerText = 
                    String(hours).padStart(2, '0') + ':' + 
                    String(minutes).padStart(2, '0') + ':' + 
                    String(seconds).padStart(2, '0');

                miningStatus.innerText = state.miningDuration === 6 ? 'Идет ночной майнинг (6ч)...' : 'Идет обычный майнинг (1ч)...';
            } else {
                // Майнинг завершился, начисляем награду
                const reward = state.miningDuration * state.speed;
                state.balance += reward;
                state.miningEndTime = null;
                saveState();

                timerContainer.style.display = 'none';
                startBtn.style.display = 'block';
                nightBtn.style.display = 'block';
                updateUI();
            }
        }

        // --- КОЛЕСО ФОРТУНЫ ---
        function openWheelTask() {
            const now = Date.now();
            if (now < state.wheelNextAvailable) {
                alert('Колесо фортуны будет доступно позже!');
                return;
            }

            // Требует 3 видео
            openModal("Колесо фортуны", 3, function() {
                // Начисляем случайную награду от 1 до 5 CC
                const randomReward = Math.floor(Math.random() * 5) + 1;
                state.balance += randomReward;
                // Кулдаун 12 часов
                state.wheelNextAvailable = Date.now() + 12 * 60 * 60 * 1000;
                saveState();
                updateUI();
                alert(`Поздравляем! Вы выиграли ${randomReward} CC в Колесе фортуны!`);
            });
        }

        function checkWheelTimer() {
            const now = Date.now();
            const wheelBtn = document.getElementById('wheel-btn');
            const wheelTimer = document.getElementById('wheel-timer');

            if (now < state.wheelNextAvailable) {
                wheelBtn.disabled = true;
                wheelBtn.classList.add('completed');
                wheelBtn.innerText = 'Ожидание';
                
                const diff = state.wheelNextAvailable - now;
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                wheelTimer.innerText = `Доступно через: ${hours}ч ${minutes}м`;
            } else {
                wheelBtn.disabled = false;
                wheelBtn.classList.remove('completed');
                wheelBtn.innerText = 'Крутить';
                wheelTimer.innerText = '';
            }
        }

        // --- ЗАДАНИЯ ---
        function completeTask(btn, reward) {
            state.balance += reward;
            btn.innerText = 'Выполнено';
            btn.classList.add('completed');
            btn.disabled = true;
            saveState();
            updateUI();
        }

        // --- МОДАЛЬНОЕ ОКНО ВИДЕО ---
        function openModal(title, videoCount, callback) {
            document.getElementById('modal-title').innerText = title;
            modalCallback = callback;
            videoRequiredTotal = videoCount;
            videoCurrentWatched = 0;
            
            document.getElementById('modal-progress').innerText = `Видео 1 из ${videoRequiredTotal}`;
            document.getElementById('modal-watch-btn').style.display = 'block';
            document.getElementById('modal-close-btn').style.display = 'none';
            document.getElementById('activation-modal').style.display = 'flex';
        }

        function simulateVideoWatch() {
            videoCurrentWatched++;
            if (videoCurrentWatched < videoRequiredTotal) {
                document.getElementById('modal-progress').innerText = `Видео ${videoCurrentWatched + 1} из ${videoRequiredTotal}`;
            } else {
                document.getElementById('modal-progress').innerText = 'Все видео просмотрены!';
                document.getElementById('modal-watch-btn').style.display = 'none';
                document.getElementById('modal-close-btn').style.display = 'block';
            }
        }

        function closeModal() {
            document.getElementById('activation-modal').style.display = 'none';
            if (modalCallback) {
                modalCallback();
                modalCallback = null;
            }
        }

        // --- ДРУЗЬЯ ---
        function inviteFriend() {
            const fakeName = 'Друг #' + Math.floor(Math.random() * 1000);
            state.friends.push(fakeName);
            
            // Динамический расчет скорости от друзей
            const count = state.friends.length;
            if (count >= 100) state.speed = 50;
            else if (count >= 50) state.speed = 20;
            else if (count >= 30) state.speed = 4;
            else if (count >= 20) state.speed = 3;
            else if (count >= 10) state.speed = 2;
            else state.speed = 1;

            saveState();
            updateUI();
            alert('Приглашение отправлено! (Тестовый друг добавлен)');
        }

        // Запуск таймеров обновления каждую секунду
        setInterval(() => {
            checkMiningTimer();
            checkWheelTimer();
        }, 1000);

        // Инициализация при старте
        loadState();
    </script>
</body>
</html>
