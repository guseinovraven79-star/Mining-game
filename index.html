<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChronoCoin</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b1f15;
            --text-color: #f4f6f9;
            --hint-color: #8fa396;
            --primary-color: #34c759;
            --night-color: #5856d6;
            --card-bg: #112e20;
            --border-color: #1a4731;
            --gold-color: #f5a623;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: 80px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        h1, h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #ffffff;
        }

        p {
            color: var(--hint-color);
            font-size: 15px;
            line-height: 1.4;
            margin-top: 0;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            margin-bottom: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
        }

        .info-card {
            text-align: left;
            background: linear-gradient(135deg, #112e20 0%, #163b2a 100%);
            border-left: 5px solid var(--primary-color);
            padding: 22px;
        }

        .info-card p, .info-card li {
            color: #d1dcd4;
        }

        .balance-title {
            font-size: 14px;
            color: var(--hint-color);
            margin-bottom: 4px;
        }

        .balance-value {
            font-size: 34px;
            font-weight: 800;
            color: var(--gold-color);
            margin-bottom: 16px;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 14px;
                <div class="content">
        <!-- TAB 1: MINING -->
        <div id="tab-mining" class="tab-content active">
            <h2>Chrono Mining</h2>
            <div class="card">
                <div class="balance-title">Ваш баланс</div>
                <div class="balance-value" id="balance">0.00 CC</div>
                
                <div id="timer-container" style="display: none;">
                    <div class="timer-display" id="timer">01:00:00</div>
                    <p id="mining-status" style="font-weight: 600; color: #ffffff;">Идет обычный майнинг...</p>
                </div>

                <!-- Кнопка обычного майнинга (ярко-зеленая) -->
                <button class="btn" id="start-mining-btn" onclick="startMining()">Запустить майнинг (1 час)</button>
                
                <div style="margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 15px;">
                    <!-- Кнопка ночного майнинга (фиолетово-синяя/индиго) -->
                    <button class="btn" id="start-night-mining-btn" style="background-color: var(--night-color); box-shadow: 0 4px 12px rgba(88, 86, 214, 0.3);" onclick="startNightMining()">Ночной майнинг (6 часов)</button>
                    <p style="font-size: 12px; margin-top: 6px; color: var(--hint-color);">Доступно строго с 22:00 до 23:59 (Требуется 5 видео)</p>
                </div>
            </div>

            <div class="card" style="text-align: left; padding: 16px;">
                <h3 style="font-size: 16px; margin-bottom: 8px; color: #fff;">Статистика скорости</h3>
                <p style="font-size: 14px; margin: 0;">Текущая базовая скорость: <strong id="current-speed" style="color: var(--gold-color);">1 CC/ч</strong></p>
                <p style="font-size: 13px; margin-top: 4px; color: var(--hint-color);">Приглашайте друзей, чтобы увеличить скорость добычи!</p>
            </div>
        </div>

        <!-- TAB 2: TASKS -->
        <div id="tab-tasks" class="tab-content">
            <h2>Ежедневные задания</h2>
            
            <!-- Wheel of Fortune Task -->
            <div class="task-item">
                <div class="task-info">
                    <div class="task-title">Колесо фортуны</div>
                    <div class="task-reward">+ Награда / 12 часов (3 видео)</div>
                    <div id="wheel-timer" style="font-size: 12px; color: var(--gold-color); margin-top: 4px; font-weight: bold;"></div>
                </div>
                <button class="task-btn" id="wheel-btn" onclick="openWheelTask()">Крутить</button>
            </div>

            <!-- Просмотр 5 видео за 10 CC -->
            <div class="task-item">
                <div class="task-info">
                    <div class="task-title">Посмотреть 5 видео</div>
                    <div class="task-reward">+10.0 CC</div>
                </div>
                <button class="task-btn" id="task-5video-btn" onclick="completeVideoTask5(this)">Смотреть</button>
            </div>

            <!-- Просмотр 1 видео за 1 CC (на усмотрение) -->
            <div class="task-item">
                <div class="task-info">
                    <div class="task-title">Посмотреть 1 видео</div>
                    <div class="task-reward">+1.0 CC</div>
                </div>
                <button class="task-btn" id="task-1video-btn" onclick="completeVideoTask1(this)">Смотреть</button>
            </div>

            <div class="task-item">
                <div class="task-info">
                    <div class="task-title">Подписаться на Telegram</div>
                    <div class="task-reward">+1.0 CC</div>
                </div>
                <button class="task-btn" onclick="completeTask(this, 1.0)">Подписаться</button>
            </div>
            <div class="task-item">
                <div class="task-info">
                    <div class="task-title">Подписаться на Instagram</div>
                    <div class="task-reward">+1.0 CC</div>
                </div>
                <button class="task-btn" onclick="completeTask(this, 1.0)">Подписаться</button>
            </div>

            <h2 style="margin-top: 24px;">Специальные задания</h2>
            <div class="task-item" style="opacity: 0.6;">
                <div class="task-info">
                    <div class="task-title">Еженедельное задание</div>
                    <div class="task-reward">Скоро</div>
                </div>
                <button class="task-btn" style="background-color: #2a3d31; color: #6c7d72;" disabled>Скоро</button>
            </div>
        </div>

        <!-- TAB 3: FRIENDS -->
        <div id="tab-friends" class="tab-content">
            <h2>Друзья</h2>
            <div class="card" style="text-align: left;">
                <p style="font-size: 14px; margin-bottom: 12px;">Приглашайте друзей и увеличивайте скорость майнинга:</p>
                <ul style="padding-left: 18px; font-size: 13px; color: #d1dcd4; margin-bottom: 16px; line-height: 1.5;">
                    <li>10 друзей = 2 CC/ч</li>
                    <li>20 друзей = 3 CC/ч</li>
                    <li>30 друзей = 4 CC/ч</li>
                    <li>50 друзей = 20 CC/ч</li>
                    <li>100 друзей = 50 CC/ч</li>
                </ul>
                <button class="btn" onclick="inviteFriend()">Пригласить друга</button>
            </div>
            <div class="card" style="text-align: left;">
                <h3 style="font-size: 15px; margin-bottom: 8px; color: #fff;">Список приглашенных (<span id="friend-count">0</span>)</h3>
                <div class="referral-list" id="friend-list-container">
                    Никого еще не приглашено
                </div>
            </div>
        </div>

        <!-- TAB 4: WALLET -->
        <div id="tab-wallet" class="tab-content">
            <h2>Кошелек</h2>
            <div class="card">
                <div class="balance-title">Доступно к выводу</div>
                <div class="balance-value" id="wallet-balance">0.00 CC</div>
                <!-- Текст про блокчейн полностью удален -->
                <button class="btn" style="background-color: #2a3d31; color: #6c7d72; margin-top: 5px;" disabled>Подключить кошелек (Скоро)</button>
            </div>
        </div>

        <!-- TAB 5: INFO -->
        <div id="tab-info" class="tab-content">
            <h2>О проекте</h2>
            <div class="card info-card">
                <p><strong>Что такое ChronoCoin?</strong> Это уникальный цифровой проект, созданный с нуля на стыке концепции времени и криптовалюты. Наша идея родилась из стремления создать по-настоящему честную экосистему, где каждый участник имеет равные возможности для старта и развития.</p>
                
                <p>Успех и развитие проекта зависят исключительно от вашей активности.</p>
                
                <ul>
                    <li><strong>Активность:</strong> Самым активным участникам в будущем будут начисляться эксклюзивные аирдропы.</li>
                    <li><strong>Друзья:</strong> Скорость майнинга растет от приглашений (от 2 до 50 CC/ч).</li>
                    <li><strong>Задания:</strong> Прохождение ежедневных заданий и колеса фортуны обязательно для будущего проекта.</li>
                </ul>

                <p><strong>Партнерство и сотрудничество:</strong> Мы всегда открыты к новым предложениям! Если вы хотите сотрудничать с нами или стать партнером проекта, вы можете легко связаться с нашей командой через официальные социальные сети.</p>

                <p style="border-top: 1px solid rgba(52,199,89,0.2); padding-top: 14px; margin-top: 14px;"><strong>Обращение от разработчиков:</strong> Мы просим каждого из вас проявить максимальную активность и <strong>обязательно подписаться на наши соцсети</strong>, чтобы нас заметили и о нас услышал весь мир! Каждый, кто пройдет этот путь до конца вместе с нами, обязательно получит достойное вознаграждение за свои усилия и преданность проекту. Давайте сделаем это вместе, ведь всё в наших руках!</p>
            </div>
        </div>
    </div>

    <!-- Модальное окно просмотра рекламного видео -->
    <div id="activation-modal" style="display: none;">
        <div class="modal-content">
            <h3 id="video-modal-title" style="margin-top:0; color:#fff;">Просмотр видео</h3>
            <p id="video-modal-desc" style="font-size: 14px; margin-bottom: 20px;">Пожалуйста, посмотрите рекламный ролик до конца...</p>
            <div id="video-progress" style="font-size: 28px; font-weight: bold; color: var(--gold-color); margin-bottom: 20px;">5</div>
            <button class="btn" id="close-video-modal" style="display: none;" onclick="finishVideoWatching()">Забрать награду</button>
        </div>
    </div>

    <script>
        let balance = parseFloat(localStorage.getItem('cc_balance')) || 0.0;
        let miningEndTime = parseInt(localStorage.getItem('cc_mining_end')) || 0;
        let nightMiningEndTime = parseInt(localStorage.getItem('cc_night_mining_end')) || 0;
        let wheelEndTime = parseInt(localStorage.getItem('cc_wheel_end')) || 0;
        
        let watchedVideosCount = parseInt(localStorage.getItem('cc_watched_videos_today')) || 0;
        let lastVideoResetDate = localStorage.getItem('cc_video_reset_date') || '';
        
        let videoTask5Completed = localStorage.getItem('cc_vtask5_done') === 'true';
        let videoTask1Completed = localStorage.getItem('cc_vtask1_done') === 'true';

        let currentVideoReward = 0;
        let currentVideoCallback = null;
        let videoCountdownInterval = null;

        const tg = window.Telegram.WebApp;
        tg.expand();

        function updateUI() {
            document.getElementById('balance').innerText = balance.toFixed(2) + ' CC';
            document.getElementById('wallet-balance').innerText = balance.toFixed(2) + ' CC';
            localStorage.setItem('cc_balance', balance);
        }

        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            document.getElementById('tab-' + tabId).classList.add('active');
            btnElement.classList.add('active');
        }

        // --- МАЙНИНГ (1 час) ---
        function startMining() {
            let now = Date.now();
            miningEndTime = now + 3600 * 1000; // 1 час
            localStorage.setItem('cc_mining_end', miningEndTime);
            checkMiningState();
        }

        // --- НОЧНОЙ МАЙНИНГ (6 часов, доступен строго с 22:00 до 23:59) ---
        function startNightMining() {
            let nowObj = new Date();
            let hours = nowObj.getHours();
            
            // Проверка времени: строго с 22:00 до 23:59
            if (hours < 22) {
                alert("Ночной майнинг доступен строго с 22:00 до 23:59!");
                return;
            }

            if (watchedVideosCount < 5) {
                alert("Для ночного майнинга необходимо посмотреть минимум 5 видео за день!");
                return;
            }

            let now = Date.now();
            nightMiningEndTime = now + 6 * 3600 * 1000; // 6 часов
            localStorage.setItem('cc_night_mining_end', nightMiningEndTime);
            checkMiningState();
        }

        function checkMiningState() {
            let now = Date.now();
            let miningBtn = document.getElementById('start-mining-btn');
            let nightBtn = document.getElementById('start-night-mining-btn');
            let timerContainer = document.getElementById('timer-container');
            let timerDisplay = document.getElementById('timer');
            let statusDisplay = document.getElementById('mining-status');

            // Проверка ночного майнинга
            if (nightMiningEndTime > now) {
                let timeLeft = Math.floor((nightMiningEndTime - now) / 1000);
                let h = String(Math.floor(timeLeft / 3600)).padStart(2, '0');
                let m = String(Math.floor((timeLeft % 3600) / 60)).padStart(2, '0');
                let s = String(timeLeft % 60).padStart(2, '0');

                timerContainer.style.display = 'block';
                timerDisplay.innerText = `${h}:${m}:${s}`;
                statusDisplay.innerText = "🌙 Ночной майнинг активен (6ч)...";
                miningBtn.style.display = 'none';
                nightBtn.style.display = 'none';
            } 
            // Проверка обычного майнинга
            else if (miningEndTime > now) {
                let timeLeft = Math.floor((miningEndTime - now) / 1000);
                let m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
                let s = String(timeLeft % 60).padStart(2, '0');

                timerContainer.style.display = 'block';
                timerDisplay.innerText = `00:${m}:${s}`;
                statusDisplay.innerText = "⚡ Идет обычный майнинг (1ч)...";
                miningBtn.style.display = 'none';
                nightBtn.style.display = 'none';
            } else {
                // Таймеры завершились
                if (miningEndTime > 0 && miningEndTime <= now) {
                    balance += 1.0; // награда за 1 час
                    miningEndTime = 0;
                    localStorage.setItem('cc_mining_end', 0);
                    updateUI();
                }
                if (nightMiningEndTime > 0 && nightMiningEndTime <= now) {
                    balance += 6.0; // награда за ночной майнинг
                    nightMiningEndTime = 0;
                    localStorage.setItem('cc_night_mining_end', 0);
                    updateUI();
                }

                timerContainer.style.display = 'none';
                miningBtn.style.display = 'block';
                nightBtn.style.display = 'block';
            }
        }

        // --- СИСТЕМА ПРОСМОТРА ВИДЕО (ИМИТАЦИЯ РЕКЛАМЫ) ---
        function openVideoModal(reward, title, callback) {
            currentVideoReward = reward;
            currentVideoCallback = callback;
            
            document.getElementById('video-modal-title').innerText = title;
            document.getElementById('video-modal-desc').innerText = "Пожалуйста, посмотрите рекламный ролик до конца...";
            let progressEl = document.getElementById('video-progress');
            let closeBtn = document.getElementById('close-video-modal');
            
            progressEl.style.display = 'block';
            closeBtn.style.display = 'none';
            document.getElementById('activation-modal').style.display = 'flex';

            let secondsLeft = 5;
            progressEl.innerText = secondsLeft;

            if (videoCountdownInterval) clearInterval(videoCountdownInterval);

            videoCountdownInterval = setInterval(() => {
                secondsLeft--;
                if (secondsLeft > 0) {
                    progressEl.innerText = secondsLeft;
                } else {
                    clearInterval(videoCountdownInterval);
                    progressEl.style.display = 'none';
                    closeBtn.style.display = 'block';
                }
            }, 1000);
        }

        function finishVideoWatching() {
            document.getElementById('activation-modal').style.display = 'none';
            
            // Учет ежедневного сброса видео
            let todayStr = new Date().toDateString();
            if (lastVideoResetDate !== todayStr) {
                watchedVideosCount = 0;
                lastVideoResetDate = todayStr;
                localStorage.setItem('cc_video_reset_date', todayStr);
            }

            watchedVideosCount++;
            localStorage.setItem('cc_watched_videos_today', watchedVideosCount);

            if (currentVideoCallback) {
                currentVideoCallback();
            }
            updateUI();
        }

        // Задание: Посмотреть 5 видео за 10 CC
        function completeVideoTask5(btn) {
            if (videoTask5Completed) return;
            openVideoModal(10.0, "Посмотреть 5 видео (+10 CC)", () => {
                balance += 10.0;
                videoTask5Completed = true;
                localStorage.setItem('cc_vtask5_done', 'true');
                btn.innerText = "Выполнено";
                btn.classList.add('completed');
                btn.disabled = true;
            });
        }

        // Задание: Посмотреть 1 видео за 1 CC
        function completeVideoTask1(btn) {
            if (videoTask1Completed) return;
            openVideoModal(1.0, "Посмотреть 1 видео (+1 CC)", () => {
                balance += 1.0;
                videoTask1Completed = true;
                localStorage.setItem('cc_vtask1_done', 'true');
                btn.innerText = "Выполнено";
                btn.classList.add('completed');
                btn.disabled = true;
            });
        }

        // Обычные задания (подписки и т.д.)
        function completeTask(btn, reward) {
            if (btn.classList.contains('completed')) return;
            balance += reward;
            btn.innerText = "Выполнено";
            btn.classList.add('completed');
            btn.disabled = true;
            updateUI();
        }

        // Колесо фортуны (каждые 12 часов, требует просмотра 3 видео)
        function openWheelTask() {
            let now = Date.now();
            if (wheelEndTime > now) {
                alert("Колесо фортуны будет доступно позже!");
                return;
            }
            openVideoModal(5.0, "Колесо Фортуны", () => {
                let winReward = Math.random() < 0.5 ? 3.0 : 7.0;
                balance += winReward;
                alert(`Вы выиграли ${winReward} CC!`);
                wheelEndTime = Date.now() + 12 * 3600 * 1000;
                localStorage.setItem('cc_wheel_end', wheelEndTime);
                updateUI();
            });
        }

        function inviteFriend() {
            let refLink = "https://t.me/ChronoCoinBot?start=ref_" + (tg.initDataUnsafe?.user?.id || 'user');
            if (navigator.clipboard) {
                navigator.clipboard.writeText(refLink).then(() => {
                    alert("Реферальная ссылка скопирована в буфер обмена!");
                });
            } else {
                prompt("Ваша реферальная ссылка:", refLink);
            }
        }

        // Инициализация при запуске
        setInterval(checkMiningState, 1000);
        updateUI();
        checkMiningState();
    </script>
